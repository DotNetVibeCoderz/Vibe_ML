# Gravicode.Science - publish the six packages to NuGet.
#
# Triggered by a tag, so the tag and the package version cannot disagree: the version is read
# from the tag and passed to `dotnet pack`, rather than being read from a file that someone
# forgot to bump. The tag is prefixed because GravicodeScience is one project inside the
# Vibe_ML monorepo and a bare `v1.0.0` would be ambiguous.
#
#   git tag gravicode-science-v1.0.0
#   git push origin gravicode-science-v1.0.0
#
# Requires one repository secret: NUGET_API_KEY, from https://www.nuget.org/account/apikeys
# scoped to Gravicode.Science.*
#
# Dibuat oleh Gravicode Studios, dipimpin oleh Kang Fadhil.

name: Gravicode.Science Release

on:
  push:
    tags:
      - 'gravicode-science-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 1.0.0'
        required: true
      dry_run:
        description: 'Pack and check, but do not push to NuGet'
        type: boolean
        default: true

defaults:
  run:
    working-directory: GravicodeScience

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    name: pack and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write        # to create the GitHub Release

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: GravicodeScience/global.json

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#gravicode-science-v}"
          fi

          # Fail here rather than publishing something malformed: a bad version on nuget.org
          # cannot be replaced, only unlisted.
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$VERSION' is not a valid semantic version."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing $VERSION"

      - name: Restore
        run: dotnet restore Gravicode.Science.sln

      - name: Build
        run: dotnet build Gravicode.Science.sln -c Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      # The suite is the gate. A package that ships a failing library is worse than a late one.
      - name: Test
        run: dotnet test Gravicode.Science.sln -c Release --no-build

      - name: Pack
        run: |
          dotnet pack Gravicode.Science.sln -c Release --no-build \
            -p:Version=${{ steps.version.outputs.version }} \
            -p:ContinuousIntegrationBuild=true

      - name: List what will be published
        run: ls -la artifacts/packages

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-${{ steps.version.outputs.version }}
          path: |
            GravicodeScience/artifacts/packages/*.nupkg
            GravicodeScience/artifacts/packages/*.snupkg
          if-no-files-found: error

      # --skip-duplicate so a re-run after a partial failure finishes the remaining packages
      # instead of failing on the ones that already landed. GraviNum is pushed first because
      # every other package depends on it, and a dependency that is not yet indexed makes the
      # dependents unrestorable for a few minutes.
      - name: Push to NuGet
        if: github.event_name == 'push' || github.event.inputs.dry_run == 'false'
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::NUGET_API_KEY is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

          dotnet nuget push "artifacts/packages/Gravicode.Science.GraviNum.*.nupkg" \
            --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

          for package in artifacts/packages/*.nupkg; do
            case "$package" in *GraviNum*) continue ;; esac
            dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: Gravicode.Science ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            GravicodeScience/artifacts/packages/*.nupkg
            GravicodeScience/artifacts/packages/*.snupkg
