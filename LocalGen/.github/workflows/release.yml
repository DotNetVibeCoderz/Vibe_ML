# Builds and publishes the installers for a tagged release.
#
# Each platform is built on its own runner because none of the three packaging tools cross-build:
# WiX needs Windows, pkgbuild and notarytool need macOS, and dpkg-deb needs Linux. The scripts
# under packaging/ are the same ones used locally — this workflow supplies credentials and a
# release to upload to, and nothing else, so a build that works here works on a laptop too.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (without the leading v)
        required: true
        default: 0.1.0

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.resolve.outputs.value }}
    steps:
      - id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: version
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [cpu, cuda12]
    # Job level, not step level: a step's own `env` block is not in scope for that step's `if`,
    # so a condition written there would read an empty string and the step would never run.
    env:
      CERTIFICATE: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Write the signing certificate
        if: env.CERTIFICATE != ''
        shell: pwsh
        run: |
          # Kept out of the workspace so it cannot be picked up by the packaging glob.
          $path = Join-Path $env:RUNNER_TEMP "localgen-signing.pfx"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:CERTIFICATE))
          "LOCALGEN_WINDOWS_CERT=$path" >> $env:GITHUB_ENV

      - name: Build the MSI
        shell: pwsh
        env:
          LOCALGEN_WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: ./packaging/windows/build.ps1 -Version ${{ needs.version.outputs.value }} -Backend ${{ matrix.backend }}

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.backend }}
          path: |
            artifacts/*.msi
            artifacts/SHA256SUMS-windows.txt

  macos:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon and Intel are separate packages rather than a universal binary: the
          # payload includes native llama.cpp libraries per architecture, and a universal build
          # would double the download for everyone to spare one group a choice.
          - arch: arm64
            runner: macos-14
          - arch: x64
            runner: macos-13
    runs-on: ${{ matrix.runner }}
    env:
      CERTIFICATE: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Import the signing certificates
        if: env.CERTIFICATE != ''
        run: |
          # A throwaway keychain, unlocked for this job only: the default login keychain on a
          # hosted runner is not unlocked, so codesign would prompt and then hang.
          keychain="$RUNNER_TEMP/localgen.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"

          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certs.p12"
          security import "$RUNNER_TEMP/certs.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychain -d user -s "$keychain" login.keychain

      - name: Store the notarisation credentials
        if: env.APPLE_API_KEY != ''
        run: |
          # An App Store Connect API key rather than an Apple ID and app-specific password: it
          # does not carry a person's account, and it does not stop working when they enable
          # two-factor authentication or leave.
          echo "$APPLE_API_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool store-credentials localgen-notary \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER"
          echo "LOCALGEN_NOTARY_PROFILE=localgen-notary" >> "$GITHUB_ENV"

      - name: Build the package
        env:
          LOCALGEN_MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          LOCALGEN_MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
        run: ./packaging/macos/build.sh --version ${{ needs.version.outputs.value }} --arch ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            artifacts/*.pkg
            artifacts/SHA256SUMS-macos-*.txt

  linux:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [cpu, cuda12]
    env:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Import the signing key
        if: env.GPG_PRIVATE_KEY != ''
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          key=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/ { print $5; exit }')
          echo "LOCALGEN_GPG_KEY=$key" >> "$GITHUB_ENV"

          # gpg would otherwise open a pinentry dialog that no runner can answer.
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          gpg-connect-agent reloadagent /bye

      - name: Build the packages
        run: ./packaging/linux/build.sh --version ${{ needs.version.outputs.value }} --backend ${{ matrix.backend }}

      - name: Check the package installs and runs
        if: matrix.backend == 'cpu'
        run: |
          # An installer that builds is not an installer that works: this catches a missing
          # dependency or a broken symlink here rather than on a user's machine.
          sudo apt-get install -y ./artifacts/localgen_${{ needs.version.outputs.value }}_amd64.deb
          localgen --version
          systemctl cat localgen >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.backend }}
          path: |
            artifacts/*.deb
            artifacts/*.tar.gz
            artifacts/SHA256SUMS-linux.txt*

  publish:
    needs: [version, windows, macos, linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect the checksums
        run: cat artifacts/SHA256SUMS-*.txt > artifacts/SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.msi
            artifacts/*.pkg
            artifacts/*.deb
            artifacts/*.tar.gz
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
