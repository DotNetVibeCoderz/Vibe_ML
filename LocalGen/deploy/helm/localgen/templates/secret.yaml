{{- if eq (include "localgen.createSecret" .) "true" }}
{{/*
API keys.

A key left empty in values is generated rather than defaulted to something guessable, and the
generated value is then pinned by looking up the Secret that already exists: without the lookup,
every `helm upgrade` would mint a new key and break every client that was using the old one.
*/}}
{{- $name := include "localgen.secretName" . -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "localgen.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.auth.enabled }}
  {{- $current := "" -}}
  {{- if and $existing $existing.data -}}
  {{- $current = index $existing.data "api-key" | default "" -}}
  {{- end }}
  {{/* `default ""` first: an unset value is nil, and b64enc rejects nil rather than treating
       it as empty — which fails the render instead of falling through to generation. */}}
  api-key: {{ default "" .Values.auth.apiKey | b64enc | default $current | default (randAlphaNum 40 | b64enc) | quote }}
  {{- end }}
  {{- range $i, $entry := .Values.auth.keys }}
  {{- $keyName := printf "tenant-%s" $entry.name -}}
  {{- $current := "" -}}
  {{- if and $existing $existing.data -}}
  {{- $current = index $existing.data $keyName | default "" -}}
  {{- end }}
  {{ $keyName }}: {{ default "" $entry.key | b64enc | default $current | default (randAlphaNum 40 | b64enc) | quote }}
  {{- end }}
{{- end }}
