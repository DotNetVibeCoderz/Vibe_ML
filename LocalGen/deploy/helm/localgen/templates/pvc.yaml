{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
{{/*
Kept out of the Deployment's own lifecycle: uninstalling the release should not silently delete
a hundred gigabytes of downloaded weights. Helm leaves this behind unless it is removed by hand.
*/}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "localgen.fullname" . }}-models
  labels:
    {{- include "localgen.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
